<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crazy Car Racing 2D - INFINITO</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        #gameContainer {
            position: relative;
            width: 800px;
            height: 600px;
            background-color: #2a2a2a;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            border: 2px solid #444;
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 20px;
            z-index: 100;
            text-shadow: 2px 2px 2px black;
        }

        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0,0,0,0.9);
            color: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            display: none;
            z-index: 200;
        }

        #startScreen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0,0,0,0.9);
            color: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            z-index: 300;
        }

        button {
            padding: 10px 20px;
            font-size: 18px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <div id="ui">
            <div>Pontuação: <span id="score">0</span></div>
            <div>Velocidade: <span id="speed">5</span></div>
            <div>Distância: <span id="distance">0</span>m</div>
        </div>

        <div id="startScreen">
            <h1>🏁 CRAZY CAR RACING 2D - INFINITO</h1>
            <p style="color: #4CAF50;">🚗 Use A e D para mover ESQUERDA/DIREITA</p>
            <p style="color: #4CAF50;">⬆️ Use W para ACELERAR para CIMA</p>
            <p style="color: #ff4444;">🚗 Desvie dos CARROS VERMELHOS</p>
            <p style="color: #f1c40f;">⭐ Quanto mais longe, mais pontos!</p>
            <button onclick="startGame()">▶ COMEÇAR</button>
        </div>

        <div id="gameOver">
            <h1>🏁 GAME OVER</h1>
            <p>Pontuação: <span id="finalScore" style="color: #f1c40f; font-size: 30px;">0</span></p>
            <p>Distância: <span id="finalDistance" style="color: #4CAF50;">0</span>m</p>
            <button onclick="resetGame()">↻ JOGAR NOVAMENTE</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Variáveis do jogo
        let gameRunning = false;
        let score = 0;
        let speed = 5;
        let frameCount = 0;
        let roadOffset = 0;
        let distance = 0;
        let worldY = 0; // Posição do mundo (infinito)
        
        // CARRO DO JOGADOR - VERDE CONVERSÍVEL
        let playerCar = {
            x: 370,
            y: 520,
            width: 50,
            height: 65,
            speed: 25,
            baseY: 520
        };
        
        // Carros adversários - VERMELHOS
        let enemyCars = [];
        const enemyColors = ['#ff4444', '#ff8888', '#ff0000', '#cc3333'];
        
        // Pistas
        const LANES = [
            { x: 130 },
            { x: 290 },
            { x: 450 },
            { x: 610 }
        ];
        
        // Limites da estrada
        const ROAD_LEFT_LIMIT = 70;
        const ROAD_RIGHT_LIMIT = 730;
        const CAR_WIDTH = 50;
        const CAR_HEIGHT = 65;
        
        // Controles
        let leftPressed = false;
        let rightPressed = false;
        let upPressed = false;
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'a' || e.key === 'A') leftPressed = true;
            if (e.key === 'd' || e.key === 'D') rightPressed = true;
            if (e.key === 'w' || e.key === 'W') upPressed = true;
        });
        
        document.addEventListener('keyup', (e) => {
            if (e.key === 'a' || e.key === 'A') leftPressed = false;
            if (e.key === 'd' || e.key === 'D') rightPressed = false;
            if (e.key === 'w' || e.key === 'W') upPressed = false;
        });
        
        // ESTRADA INFINITA
        function drawRoad() {
            // Asfalto base
            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Faixas laterais BRANCAS (efeito infinito)
            ctx.fillStyle = '#ecf0f1';
            for (let i = 0; i < 20; i++) {
                let y = (i * 50 + roadOffset + worldY) % (canvas.height + 100) - 50;
                ctx.fillRect(ROAD_LEFT_LIMIT - 3, y, 6, 30);
                ctx.fillRect(ROAD_RIGHT_LIMIT - 3, y, 6, 30);
            }
            
            // Faixas divisórias AMARELAS
            ctx.fillStyle = '#f1c40f';
            for (let i = 0; i < 20; i++) {
                let y = (i * 70 + roadOffset + worldY) % (canvas.height + 100) - 50;
                ctx.fillRect(200, y, 6, 35);
                ctx.fillRect(360, y, 6, 35);
                ctx.fillRect(520, y, 6, 35);
                ctx.fillRect(680, y, 6, 35);
            }
            
            // Acostamento
            ctx.fillStyle = '#27ae60';
            ctx.fillRect(0, 0, ROAD_LEFT_LIMIT - 10, canvas.height);
            ctx.fillRect(ROAD_RIGHT_LIMIT + 10, 0, 50, canvas.height);
            
            // Linha de chegada infinita (marcadores de distância)
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            for (let i = 0; i < 10; i++) {
                let y = (i * 100 + worldY * 2) % canvas.height;
                ctx.fillRect(ROAD_LEFT_LIMIT, y, ROAD_RIGHT_LIMIT - ROAD_LEFT_LIMIT, 2);
            }
        }
        
        // CARRO VERDE CONVERSÍVEL
        function drawPlayerCar() {
            // SOMBRA
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.fillRect(playerCar.x - 2, playerCar.y + playerCar.height, playerCar.width + 4, 4);
            
            // CORPO DO CARRO
            ctx.fillStyle = '#00cc00';
            ctx.fillRect(playerCar.x, playerCar.y, playerCar.width, playerCar.height);
            
            // BANCO DO CONVERSÍVEL
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(playerCar.x + 12, playerCar.y + 15, 8, 12);
            ctx.fillRect(playerCar.x + playerCar.width - 20, playerCar.y + 15, 8, 12);
            
            // PILOTO
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.arc(playerCar.x + 25, playerCar.y + 18, 6, 0, Math.PI * 2);
            ctx.fill();
            
            // PARA-BRISA DIANTEIRO
            ctx.fillStyle = '#3498db';
            ctx.fillRect(playerCar.x + 18, playerCar.y - 2, 14, 6);
            
            // FARÓIS DIANTEIROS
            ctx.fillStyle = '#ffff00';
            ctx.fillRect(playerCar.x + 2, playerCar.y + playerCar.height - 6, 4, 4);
            ctx.fillRect(playerCar.x + playerCar.width - 6, playerCar.y + playerCar.height - 6, 4, 4);
            
            // RODAS
            ctx.fillStyle = '#000000';
            ctx.fillRect(playerCar.x - 4, playerCar.y + 12, 6, 12);
            ctx.fillRect(playerCar.x + playerCar.width - 2, playerCar.y + 12, 6, 12);
            ctx.fillRect(playerCar.x - 4, playerCar.y + playerCar.height - 24, 6, 12);
            ctx.fillRect(playerCar.x + playerCar.width - 2, playerCar.y + playerCar.height - 24, 6, 12);
        }
        
        // CARROS INIMIGOS
        function createEnemyCar() {
            const laneIndex = Math.floor(Math.random() * LANES.length);
            const laneX = LANES[laneIndex].x;
            const carX = laneX - CAR_WIDTH/2;
            
            // Gera carros em diferentes alturas, considerando o mundo infinito
            let startY = -CAR_HEIGHT - (worldY % 300);
            if (startY < -CAR_HEIGHT * 2) startY = -CAR_HEIGHT;
            
            enemyCars.push({
                x: carX,
                y: startY,
                width: CAR_WIDTH,
                height: CAR_HEIGHT,
                color: enemyColors[Math.floor(Math.random() * enemyColors.length)],
                speed: speed + Math.floor(Math.random() * 4) + 3,
                lane: laneIndex
            });
        }
        
        function drawEnemyCars() {
            enemyCars.forEach(car => {
                // Corpo do carro
                ctx.fillStyle = car.color;
                ctx.fillRect(car.x, car.y, car.width, car.height);
                
                // JANELA (em cima)
                ctx.fillStyle = '#87CEEB';
                ctx.fillRect(car.x + 8, car.y + 8, car.width - 16, 18);
                
                // Rodas
                ctx.fillStyle = '#000000';
                ctx.fillRect(car.x - 4, car.y + 12, 6, 12);
                ctx.fillRect(car.x + car.width - 2, car.y + 12, 6, 12);
                ctx.fillRect(car.x - 4, car.y + car.height - 24, 6, 12);
                ctx.fillRect(car.x + car.width - 2, car.y + car.height - 24, 6, 12);
                
                // FARÓIS DIANTEIROS (em baixo)
                ctx.fillStyle = '#ffff00';
                ctx.fillRect(car.x + 2, car.y + car.height - 6, 4, 4);
                ctx.fillRect(car.x + car.width - 6, car.y + car.height - 6, 4, 4);
            });
        }
        
        function updateEnemyCars() {
            enemyCars.forEach((car, index) => {
                // Carros descem normalmente
                car.y += car.speed;
                
                // Remove carros que passaram da tela
                if (car.y > canvas.height + 100) {
                    enemyCars.splice(index, 1);
                    score += 10;
                    document.getElementById('score').textContent = score;
                }
            });
        }
        
        // MOVIMENTAÇÃO DO CARRO (COM W PARA CIMA)
        function movePlayerCar() {
            // Movimento lateral
            if (leftPressed && playerCar.x > ROAD_LEFT_LIMIT) {
                playerCar.x -= playerCar.speed;
            }
            if (rightPressed && playerCar.x + playerCar.width < ROAD_RIGHT_LIMIT) {
                playerCar.x += playerCar.speed;
            }
            
            // Movimento para CIMA (W) - ESSE É O CORAÇÃO DO JOGO INFINITO
            if (upPressed) {
                worldY += playerCar.speed * 1.5; // O mundo desce, dando sensação que o carro sobe
                distance += 1;
                document.getElementById('distance').textContent = distance;
                
                // Aumenta pontuação conforme sobe
                if (distance % 10 === 0) {
                    score += 5;
                    document.getElementById('score').textContent = score;
                }
                
                // Aumenta dificuldade conforme sobe
                if (distance % 50 === 0) {
                    speed += 0.2;
                    document.getElementById('speed').textContent = speed.toFixed(1);
                }
            }
            
            // Limites laterais
            if (playerCar.x < ROAD_LEFT_LIMIT) playerCar.x = ROAD_LEFT_LIMIT;
            if (playerCar.x + playerCar.width > ROAD_RIGHT_LIMIT) playerCar.x = ROAD_RIGHT_LIMIT - playerCar.width;
            
            // Carro sempre na mesma posição Y (só o mundo se move)
            playerCar.y = playerCar.baseY;
        }
        
        // GERADOR INFINITO DE CARROS
        function generateInfiniteCars() {
            // Gera carros baseado na distância percorrida
            let spawnRate = Math.max(20, 30 - Math.floor(distance / 50));
            
            if (frameCount % spawnRate === 0) {
                // Gera de 1 a 3 carros por vez
                let carCount = Math.floor(Math.random() * 3) + 1;
                for (let i = 0; i < carCount; i++) {
                    setTimeout(() => {
                        if (gameRunning) createEnemyCar();
                    }, i * 100);
                }
            }
            
            // Gera carros adicionais quando o jogador está subindo rápido
            if (upPressed && frameCount % 15 === 0 && Math.random() > 0.5) {
                createEnemyCar();
            }
        }
        
        function checkCollision() {
            return enemyCars.some(car => {
                return (playerCar.x < car.x + car.width - 5 &&
                        playerCar.x + playerCar.width > car.x + 5 &&
                        playerCar.y < car.y + car.height - 5 &&
                        playerCar.y + playerCar.height > car.y + 5);
            });
        }
        
        function gameLoop() {
            if (!gameRunning) return;
            
            roadOffset = (roadOffset + 4) % canvas.height;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            drawRoad();
            drawPlayerCar();
            drawEnemyCars();
            
            movePlayerCar();
            updateEnemyCars();
            generateInfiniteCars();
            
            frameCount++;
            
            if (checkCollision()) {
                gameOver();
                return;
            }
            
            requestAnimationFrame(gameLoop);
        }
        
        function startGame() {
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('gameOver').style.display = 'none';
            gameRunning = true;
            resetGameState();
            gameLoop();
        }
        
        function resetGameState() {
            playerCar.x = 370;
            playerCar.y = 520;
            playerCar.baseY = 520;
            enemyCars = [];
            score = 0;
            speed = 5;
            distance = 0;
            worldY = 0;
            frameCount = 0;
            roadOffset = 0;
            leftPressed = false;
            rightPressed = false;
            upPressed = false;
            document.getElementById('score').textContent = '0';
            document.getElementById('speed').textContent = '5';
            document.getElementById('distance').textContent = '0';
        }
        
        function gameOver() {
            gameRunning = false;
            document.getElementById('finalScore').textContent = score;
            document.getElementById('finalDistance').textContent = distance;
            document.getElementById('gameOver').style.display = 'block';
        }
        
        function resetGame() {
            document.getElementById('gameOver').style.display = 'none';
            startGame();
        }
    </script>
</body>
</html>
