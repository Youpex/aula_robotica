<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crazy Car Racing 2D - INFINITO</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
        }

        #gameContainer {
            position: relative;
            width: 800px;
            height: 600px;
            background-color: #2a2a2a;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            border: 2px solid #444;
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 20px;
            z-index: 100;
            text-shadow: 2px 2px 2px black;
            background: rgba(0,0,0,0.6);
            padding: 15px;
            border-radius: 10px;
            border-left: 5px solid #4CAF50;
        }

        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0,0,0,0.95);
            color: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            display: none;
            z-index: 200;
            border: 3px solid #ff4444;
        }

        #startScreen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0,0,0,0.95);
            color: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            z-index: 300;
            border: 3px solid #4CAF50;
        }

        button {
            padding: 15px 30px;
            font-size: 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: bold;
            transition: transform 0.2s;
        }

        button:hover {
            background-color: #45a049;
            transform: scale(1.1);
        }

        .speedometer {
            width: 100px;
            height: 100px;
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            border-radius: 50%;
            border: 3px solid #4CAF50;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 150;
        }

        .speed-value {
            font-size: 28px;
            font-weight: bold;
            color: #4CAF50;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <div id="ui">
            <div>🏁 PONTUAÇÃO: <span id="score" style="color: #f1c40f;">0</span></div>
            <div>📏 DISTÂNCIA: <span id="distance" style="color: #4CAF50;">0</span>m</div>
            <div>⚡ VELOCIDADE: <span id="speed" style="color: #3498db;">5</span></div>
            <div>🚗 CARROS DESVIADOS: <span id="carsPassed" style="color: #ff4444;">0</span></div>
        </div>

        <div class="speedometer">
            <div style="font-size: 12px;">KM/H</div>
            <div class="speed-value" id="speedValue">50</div>
        </div>

        <div id="startScreen">
            <h1 style="color: #4CAF50; font-size: 36px;">🏁 CRAZY CAR RACING</h1>
            <p style="font-size: 18px; margin: 20px 0;">⚡ JOGO INFINITO 2D ⚡</p>
            <div style="text-align: left; background: rgba(255,255,255,0.1); padding: 20px; border-radius: 10px; margin: 20px 0;">
                <p style="color: #4CAF50;">⬆️ W - ACELERAR / SUBIR</p>
                <p style="color: #4CAF50;">⬅️ A - ESQUERDA</p>
                <p style="color: #4CAF50;">➡️ D - DIREITA</p>
                <p style="color: #ff4444;">⚠️ DESVIE DOS CARROS VERMELHOS</p>
            </div>
            <button onclick="startGame()">▶ COMEÇAR CORRIDA</button>
        </div>

        <div id="gameOver">
            <h1 style="color: #ff4444; font-size: 36px;">🏁 GAME OVER</h1>
            <div style="background: rgba(255,255,255,0.1); padding: 20px; border-radius: 10px; margin: 20px 0;">
                <p style="font-size: 24px;">Pontuação: <span id="finalScore" style="color: #f1c40f;">0</span></p>
                <p style="font-size: 20px;">Distância: <span id="finalDistance" style="color: #4CAF50;">0</span>m</p>
                <p style="font-size: 20px;">Carros desviados: <span id="finalCarsPassed" style="color: #ff4444;">0</span></p>
            </div>
            <button onclick="resetGame()" style="background: #ff4444;">↻ JOGAR NOVAMENTE</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // ========== VARIÁVEIS DO JOGO ==========
        let gameRunning = false;
        let score = 0;
        let baseSpeed = 5;
        let currentSpeed = 5;
        let frameCount = 0;
        let distance = 0;
        let carsPassed = 0;
        
        // ========== SISTEMA DE TERRENO GERADO PROCEDURALMENTE ==========
        let terrainSegments = [];
        const MAX_SEGMENTS = 30;
        let worldY = 0;
        
        // ========== CARRO DO JOGADOR - FÍSICA MELHORADA ==========
        let playerCar = {
            x: 370,
            y: 520,
            width: 50,
            height: 65,
            speed: 0,
            maxSpeed: 18,
            acceleration: 0.8,
            deceleration: 0.5,
            turnSpeed: 4.5,
            baseY: 520
        };
        
        // ========== CARROS INIMIGOS ==========
        let enemyCars = [];
        const enemyColors = ['#ff4444', '#ff0000', '#cc3333', '#aa2222'];
        
        // ========== PISTAS ==========
        const LANES = [
            { x: 130 },
            { x: 290 },
            { x: 450 },
            { x: 610 }
        ];
        
        // ========== LIMITES DA ESTRADA ==========
        const ROAD_LEFT_LIMIT = 70;
        const ROAD_RIGHT_LIMIT = 730;
        const CAR_WIDTH = 50;
        const CAR_HEIGHT = 65;
        
        // ========== CONTROLES ==========
        let leftPressed = false;
        let rightPressed = false;
        let upPressed = false;
        
        // ========== EVENT LISTENERS ==========
        document.addEventListener('keydown', (e) => {
            if (e.key === 'a' || e.key === 'A') leftPressed = true;
            if (e.key === 'd' || e.key === 'D') rightPressed = true;
            if (e.key === 'w' || e.key === 'W') upPressed = true;
        });
        
        document.addEventListener('keyup', (e) => {
            if (e.key === 'a' || e.key === 'A') leftPressed = false;
            if (e.key === 'd' || e.key === 'D') rightPressed = false;
            if (e.key === 'w' || e.key === 'W') upPressed = false;
        });
        
        // ========== INICIALIZAR TERRENO ==========
        function initTerrain() {
            terrainSegments = [];
            for (let i = 0; i < MAX_SEGMENTS; i++) {
                terrainSegments.push({
                    y: i * 40,
                    type: Math.floor(Math.random() * 3),
                    offset: Math.random() * 20 - 10,
                    hasTree: Math.random() > 0.7,
                    hasLight: Math.random() > 0.8
                });
            }
        }
        
        // ========== GERAR TERRENO DINÂMICO ==========
        function generateTerrain() {
            // Adiciona novos segmentos conforme o jogador sobe
            while (terrainSegments.length < MAX_SEGMENTS) {
                let lastY = terrainSegments.length > 0 ? terrainSegments[terrainSegments.length - 1].y : 0;
                terrainSegments.push({
                    y: lastY + 40,
                    type: Math.floor(Math.random() * 3),
                    offset: Math.random() * 20 - 10,
                    hasTree: Math.random() > 0.7,
                    hasLight: Math.random() > 0.8
                });
            }
            
            // Remove segmentos antigos
            terrainSegments = terrainSegments.filter(segment => segment.y > worldY - 100);
        }
        
        // ========== DESENHAR TERRENO ==========
        function drawTerrain() {
            // Céu gradiente (efeito de profundidade)
            let gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#0a1a2a');
            gradient.addColorStop(1, '#1a2a3a');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Desenha segmentos do terreno
            terrainSegments.forEach(segment => {
                let y = segment.y - worldY;
                if (y > -100 && y < canvas.height + 100) {
                    
                    // Asfalto com variação de cor
                    let asphaltColor = segment.type === 0 ? '#2c3e50' : '#34495e';
                    ctx.fillStyle = asphaltColor;
                    ctx.fillRect(ROAD_LEFT_LIMIT - 5, y - 20, ROAD_RIGHT_LIMIT - ROAD_LEFT_LIMIT + 10, 45);
                    
                    // Textura do asfalto (grãos)
                    ctx.fillStyle = 'rgba(255,255,255,0.05)';
                    for (let i = 0; i < 5; i++) {
                        let x = ROAD_LEFT_LIMIT + Math.random() * (ROAD_RIGHT_LIMIT - ROAD_LEFT_LIMIT);
                        ctx.fillRect(x, y - 10 + Math.random() * 30, 2, 2);
                    }
                    
                    // Faixas laterais (brancas)
                    ctx.fillStyle = '#ecf0f1';
                    ctx.fillRect(ROAD_LEFT_LIMIT - 3, y - 5, 6, 15);
                    ctx.fillRect(ROAD_RIGHT_LIMIT - 3, y - 5, 6, 15);
                    
                    // Faixas divisórias (amarelas)
                    ctx.fillStyle = '#f1c40f';
                    if (segment.type % 2 === 0) {
                        ctx.fillRect(200, y - 3, 6, 20);
                        ctx.fillRect(360, y - 3, 6, 20);
                        ctx.fillRect(520, y - 3, 6, 20);
                        ctx.fillRect(680, y - 3, 6, 20);
                    }
                    
                    // Acostamento com textura
                    ctx.fillStyle = '#27ae60';
                    ctx.fillRect(0, y - 20, ROAD_LEFT_LIMIT - 10, 45);
                    ctx.fillRect(ROAD_RIGHT_LIMIT + 10, y - 20, 50, 45);
                    
                    // Árvores e postes (gerados proceduralmente)
                    if (segment.hasTree) {
                        // Árvore esquerda
                        ctx.fillStyle = '#8B4513';
                        ctx.fillRect(20 + segment.offset, y - 5, 5, 25);
                        ctx.fillStyle = '#2e8b57';
                        ctx.beginPath();
                        ctx.arc(22.5 + segment.offset, y - 15, 12, 0, Math.PI * 2);
                        ctx.fill();
                        
                        // Árvore direita
                        ctx.fillStyle = '#8B4513';
                        ctx.fillRect(770 - segment.offset, y - 5, 5, 25);
                        ctx.fillStyle = '#2e8b57';
                        ctx.beginPath();
                        ctx.arc(772.5 - segment.offset, y - 15, 12, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    
                    if (segment.hasLight) {
                        // Poste de luz esquerdo
                        ctx.fillStyle = '#95a5a6';
                        ctx.fillRect(40, y - 10, 4, 30);
                        ctx.fillStyle = '#f1c40f';
                        ctx.beginPath();
                        ctx.arc(42, y - 20, 6, 0, Math.PI * 2);
                        ctx.fill();
                        
                        // Poste de luz direito
                        ctx.fillStyle = '#95a5a6';
                        ctx.fillRect(756, y - 10, 4, 30);
                        ctx.fillStyle = '#f1c40f';
                        ctx.beginPath();
                        ctx.arc(758, y - 20, 6, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            });
            
            // Linha do horizonte
            ctx.fillStyle = 'rgba(255,255,255,0.1)';
            ctx.fillRect(0, 0, canvas.width, 5);
        }
        
        // ========== DESENHAR CARRO VERDE CONVERSÍVEL ==========
        function drawPlayerCar() {
            // Sombra dinâmica (maior quanto mais velocidade)
            let shadowSize = 4 + (playerCar.speed / 5);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fillRect(playerCar.x - shadowSize/2, playerCar.y + playerCar.height - 2, playerCar.width + shadowSize, 8);
            
            // Efeito de movimento (borrão)
            if (playerCar.speed > 10) {
                ctx.fillStyle = 'rgba(0, 204, 0, 0.2)';
                ctx.fillRect(playerCar.x - 2, playerCar.y + playerCar.height - 10, playerCar.width + 4, 5);
            }
            
            // CORPO DO CARRO
            ctx.fillStyle = '#00cc00';
            ctx.fillRect(playerCar.x, playerCar.y, playerCar.width, playerCar.height);
            
            // BANCO DO CONVERSÍVEL
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(playerCar.x + 12, playerCar.y + 15, 8, 12);
            ctx.fillRect(playerCar.x + playerCar.width - 20, playerCar.y + 15, 8, 12);
            
            // PILOTO (capacete dourado)
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.arc(playerCar.x + 25, playerCar.y + 18, 6, 0, Math.PI * 2);
            ctx.fill();
            
            // PARA-BRISA
            ctx.fillStyle = '#3498db';
            ctx.fillRect(playerCar.x + 18, playerCar.y - 2, 14, 6);
            
            // FARÓIS DIANTEIROS (acesos)
            ctx.fillStyle = '#ffff00';
            ctx.fillRect(playerCar.x + 2, playerCar.y + playerCar.height - 6, 4, 4);
            ctx.fillRect(playerCar.x + playerCar.width - 6, playerCar.y + playerCar.height - 6, 4, 4);
            
            // RODAS
            ctx.fillStyle = '#000000';
            ctx.fillRect(playerCar.x - 5, playerCar.y + 12, 6, 14);
            ctx.fillRect(playerCar.x + playerCar.width - 1, playerCar.y + 12, 6, 14);
            ctx.fillRect(playerCar.x - 5, playerCar.y + playerCar.height - 26, 6, 14);
            ctx.fillRect(playerCar.x + playerCar.width - 1, playerCar.y + playerCar.height - 26, 6, 14);
            
            // ARO DAS RODAS
            ctx.fillStyle = '#888888';
            ctx.fillRect(playerCar.x - 3, playerCar.y + 15, 2, 8);
            ctx.fillRect(playerCar.x + playerCar.width + 1, playerCar.y + 15, 2, 8);
            ctx.fillRect(playerCar.x - 3, playerCar.y + playerCar.height - 23, 2, 8);
            ctx.fillRect(playerCar.x + playerCar.width + 1, playerCar.y + playerCar.height - 23, 2, 8);
        }
        
        // ========== DESENHAR CARROS INIMIGOS ==========
        function drawEnemyCars() {
            enemyCars.forEach(car => {
                // Sombra
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.fillRect(car.x - 2, car.y + car.height, car.width + 4, 6);
                
                // Corpo
                ctx.fillStyle = car.color;
                ctx.fillRect(car.x, car.y, car.width, car.height);
                
                // Janela
                ctx.fillStyle = '#87CEEB';
                ctx.fillRect(car.x + 8, car.y + 8, car.width - 16, 18);
                
                // Rodas
                ctx.fillStyle = '#000000';
                ctx.fillRect(car.x - 5, car.y + 12, 6, 14);
                ctx.fillRect(car.x + car.width - 1, car.y + 12, 6, 14);
                ctx.fillRect(car.x - 5, car.y + car.height - 26, 6, 14);
                ctx.fillRect(car.x + car.width - 1, car.y + car.height - 26, 6, 14);
                
                // Faróis
                ctx.fillStyle = '#ffff00';
                ctx.fillRect(car.x + 2, car.y + car.height - 6, 4, 4);
                ctx.fillRect(car.x + car.width - 6, car.y + car.height - 6, 4, 4);
            });
        }
        
        // ========== CRIAR CARRO INIMIGO ==========
        function createEnemyCar() {
            const laneIndex = Math.floor(Math.random() * LANES.length);
            const laneX = LANES[laneIndex].x;
            const carX = laneX - CAR_WIDTH/2;
            
            enemyCars.push({
                x: carX,
                y: -CAR_HEIGHT - (Math.random() * 200),
                width: CAR_WIDTH,
                height: CAR_HEIGHT,
                color: enemyColors[Math.floor(Math.random() * enemyColors.length)],
                speed: baseSpeed + 2 + Math.floor(Math.random() * 4),
                lane: laneIndex
            });
        }
        
        // ========== ATUALIZAR CARROS INIMIGOS ==========
        function updateEnemyCars() {
            enemyCars.forEach((car, index) => {
                // Velocidade baseada na velocidade do jogador
                car.y += car.speed + (playerCar.speed / 3);
                
                // Remove carros que passaram
                if (car.y > canvas.height + 100) {
                    enemyCars.splice(index, 1);
                    score += 10;
                    carsPassed += 1;
                    document.getElementById('score').textContent = score;
                    document.getElementById('carsPassed').textContent = carsPassed;
                }
            });
        }
        
        // ========== FÍSICA DO CARRO (MOVIMENTAÇÃO MELHORADA) ==========
        function updateCarPhysics() {
            // ACELERAÇÃO (W)
            if (upPressed) {
                playerCar.speed = Math.min(playerCar.speed + playerCar.acceleration, playerCar.maxSpeed);
            } else {
                // DESACELERAÇÃO
                playerCar.speed = Math.max(playerCar.speed - playerCar.deceleration, 0);
            }
            
            // MOVIMENTO LATERAL (A e D)
            if (leftPressed) {
                playerCar.x -= playerCar.turnSpeed + (playerCar.speed / 10);
            }
            if (rightPressed) {
                playerCar.x += playerCar.turnSpeed + (playerCar.speed / 10);
            }
            
            // LIMITES LATERAIS
            playerCar.x = Math.max(ROAD_LEFT_LIMIT, Math.min(ROAD_RIGHT_LIMIT - playerCar.width, playerCar.x));
            
            // MOVIMENTO DO MUNDO (sobe mais rápido com velocidade)
            worldY += playerCar.speed * 0.8;
            
            // ATUALIZA DISTÂNCIA
            distance += playerCar.speed / 3;
            document.getElementById('distance').textContent = Math.floor(distance);
            
            // ATUALIZA VELOCIDADE NA UI
            currentSpeed = baseSpeed + (playerCar.speed / 2);
            document.getElementById('speed').textContent = currentSpeed.toFixed(1);
            document.getElementById('speedValue').textContent = Math.floor(playerCar.speed * 8);
            
            // AUMENTA DIFICULDADE
            if (distance % 100 === 0 && distance > 0) {
                baseSpeed += 0.2;
                playerCar.maxSpeed += 0.2;
            }
        }
        
        // ========== GERADOR DE CARROS ==========
        function generateCars() {
            // Mais carros conforme aumenta a velocidade
            let spawnRate = Math.max(15, 35 - Math.floor(playerCar.speed));
            
            if (frameCount % spawnRate === 0) {
                let carCount = Math.floor(Math.random() * 2) + 1;
                for (let i = 0; i < carCount; i++) {
                    setTimeout(() => {
                        if (gameRunning) createEnemyCar();
                    }, i * 50);
                }
            }
        }
        
        // ========== VERIFICAR COLISÃO ==========
        function checkCollision() {
            return enemyCars.some(car => {
                return (playerCar.x < car.x + car.width - 8 &&
                        playerCar.x + playerCar.width > car.x + 8 &&
                        playerCar.y < car.y + car.height - 8 &&
                        playerCar.y + playerCar.height > car.y + 8);
            });
        }
        
        // ========== GAME LOOP ==========
        function gameLoop() {
            if (!gameRunning) return;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // GERA TERRENO
            generateTerrain();
            
            // DESENHA ELEMENTOS
            drawTerrain();
            drawPlayerCar();
            drawEnemyCars();
            
            // ATUALIZA FÍSICA
            updateCarPhysics();
            updateEnemyCars();
            generateCars();
            
            frameCount++;
            
            // VERIFICA COLISÃO
            if (checkCollision()) {
                gameOver();
                return;
            }
            
            requestAnimationFrame(gameLoop);
        }
        
        // ========== INICIAR JOGO ==========
        function startGame() {
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('gameOver').style.display = 'none';
            gameRunning = true;
            resetGameState();
            gameLoop();
        }
        
        // ========== RESETAR ESTADO ==========
        function resetGameState() {
            playerCar = {
                x: 370,
                y: 520,
                width: 50,
                height: 65,
                speed: 0,
                maxSpeed: 18,
                acceleration: 0.8,
                deceleration: 0.5,
                turnSpeed: 4.5,
                baseY: 520
            };
            
            enemyCars = [];
            score = 0;
            baseSpeed = 5;
            currentSpeed = 5;
            distance = 0;
            carsPassed = 0;
            worldY = 0;
            frameCount = 0;
            leftPressed = false;
            rightPressed = false;
            upPressed = false;
            
            document.getElementById('score').textContent = '0';
            document.getElementById('speed').textContent = '5';
            document.getElementById('distance').textContent = '0';
            document.getElementById('carsPassed').textContent = '0';
            document.getElementById('speedValue').textContent = '0';
            
            initTerrain();
        }
        
        // ========== GAME OVER ==========
        function gameOver() {
            gameRunning = false;
            document.getElementById('finalScore').textContent = score;
            document.getElementById('finalDistance').textContent = Math.floor(distance);
            document.getElementById('finalCarsPassed').textContent = carsPassed;
            document.getElementById('gameOver').style.display = 'block';
        }
        
        // ========== RESETAR JOGO ==========
        function resetGame() {
            document.getElementById('gameOver').style.display = 'none';
            startGame();
        }
        
        // Inicializa terreno
        initTerrain();
    </script>
</body>
</html>
